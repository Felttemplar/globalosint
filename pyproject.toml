[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "globalosint"
version = "0.1.0"
description = "Fundação rastreável para inteligência de fontes abertas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
globalosint = "globalosint.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
